# ---------- raw order view (L12-owned) ----------
# The single-vendor documents select the shared L5 order fields plus L12-only
# fields (`orderState` from SV13, `scheduledAt`, `deliveryType`). L5's own
# `OrderOrder` type does not carry them, so the L12 contract owns this view.
type SingleVendorOrder {
  _id: ID
  acceptedAt: String
  assignedAt: String
  cancelledAt: String
  completionTime: String
  createdAt: String
  deliveredAt: String
  deliveryAddress: SingleVendorOrderAddress
  deliveryCharges: Float
  deliveryType: String
  eta: OrderEta
  expectedTime: String
  instructions: String
  isPickedUp: Boolean
  items: [SingleVendorOrderItem]
  orderAmount: Float
  orderDate: String
  orderId: String
  orderState: String
  orderStatus: String
  paidAmount: Float
  paymentMethod: String
  pickedAt: String
  preparationTime: String
  restaurant: Restaurant
  review: Review
  rider: SingleVendorOrderRider
  scheduledAt: String
  taxationAmount: Float
  tipping: Float
  user: User
}

